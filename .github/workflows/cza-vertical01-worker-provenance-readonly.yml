name: CZA V01 Active Worker Provenance Read-only
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/qa/cza-vertical01-worker-provenance-readonly.mjs'
      - '.github/workflows/cza-vertical01-worker-provenance-readonly.yml'
permissions:
  contents: read
jobs:
  verify-staging-active-version:
    if: github.event.pull_request.number == 73 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout PR candidate without persisted credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.13.0'
      - name: Read active Worker metadata without accessing secret values
        env:
          CZA_STAGING_PREVIEW_API_TOKEN: ${{ secrets.CZA_STAGING_PREVIEW_API_TOKEN }}
        run: node scripts/qa/cza-vertical01-worker-provenance-readonly.mjs
