name: Faz3 P1 provision gate

on:
  workflow_dispatch:
    inputs:
      authorize_p1:
        description: Must remain false until an independent P0-C decision and separate written P1 authorization
        required: true
        type: boolean
        default: false
      p0c_attestation_sha256:
        description: Exact 64-hex digest of the independently accepted P0-C attestation
        required: true
        type: string
      native_provider_proof_run_id:
        description: GitHub Actions run ID containing the exact-commit B1 native provider proof
        required: true
        type: string
      native_provider_artifact_digest:
        description: Exact 64-hex SHA-256 digest reported by upload-artifact for the B1 proof
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  p1:
    if: inputs.authorize_p1 == true && github.ref == 'refs/heads/feature/faz3-gate1b-v4'
    uses: dekorix/cza-akademi/.github/workflows/faz3-p1-provision-reusable.yml@b12242db1a8db886caee4c6f07ba1b1a98bea638
    with:
      authorize_p1: ${{ inputs.authorize_p1 }}
      p0c_attestation_sha256: ${{ inputs.p0c_attestation_sha256 }}
      native_provider_proof_run_id: ${{ inputs.native_provider_proof_run_id }}
      native_provider_artifact_digest: ${{ inputs.native_provider_artifact_digest }}
