name: CZA Mind Maps Browser Acceptance
on:
  push:
    branches: [feature/mind-maps-v1]
    paths:
      - 'app/mind-maps/**'
      - 'lib/mind-maps.ts'
      - 'lib/package-catalog.ts'
      - 'tests/mind-maps-browser-acceptance.spec.cjs'
      - '.github/workflows/mind-maps-browser-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-mind-maps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.13.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm add -Dw @playwright/test@1.52.0 --lockfile=false
          pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: |
          pnpm exec wrangler dev --config dist/server/wrangler.json --port 8787 > /tmp/cza-mind-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/mind-maps > /tmp/mind-maps.html; then exit 0; fi
            sleep 1
          done
          cat /tmp/cza-mind-preview.log
          exit 1
      - name: Run desktop and mobile mind-map flow
        env:
          CZA_BASE_URL: http://127.0.0.1:8787
        run: pnpm exec playwright test tests/mind-maps-browser-acceptance.spec.cjs --reporter=line --workers=1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cza-mind-maps-browser-acceptance
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
