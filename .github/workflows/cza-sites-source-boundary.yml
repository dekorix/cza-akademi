name: CZA Sites Source Boundary

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  no-chatgpt-sites-binding:
    name: CZA core Sites source isolation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Run repo Sites-boundary regression tests
        run: node --test tests/cza-sites-boundary.test.mjs
