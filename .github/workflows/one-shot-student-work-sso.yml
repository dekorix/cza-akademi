name: One-shot student work SSO patch

on:
  push:
    branches:
      - fix/student-work-sso

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/student-work-sso

      - name: Patch Apps Script student shortcut
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps-script/Index.html')
          text = path.read_text(encoding='utf-8')

          old_button = '<button id="workshopShortcutButton" class="ws-button primary" type="button" data-view="workshops">Atölyelere Git →</button>'
          new_button = '<button id="workshopShortcutButton" class="ws-button primary" type="button">Atölyelere Git →</button>'
          if old_button not in text:
              raise SystemExit('workshop shortcut button pattern not found')
          text = text.replace(old_button, new_button, 1)

          anchor = '      function openDashboardPrimaryAction() {'
          if anchor not in text:
              raise SystemExit('openDashboardPrimaryAction anchor not found')
          bridge = '''      async function openWorkPanel() {
        const button = byId('workshopShortcutButton');
        if (!state.token || !button || button.disabled) return;
        const previousLabel = button.textContent;
        button.disabled = true;
        button.textContent = 'Çalışma Paneli açılıyor…';
        try {
          const handoff = await server('createWorkPanelHandoff', state.token);
          if (!handoff || handoff.ok !== true || !handoff.url) {
            throw new Error('Güvenli panel geçişi hazırlanamadı.');
          }
          window.location.assign(handoff.url);
        } catch (error) {
          if (/Oturum/i.test(error.message)) return showLogin(error.message);
          byId('workshopShortcutText').textContent = error.message + ' Lütfen yeniden dene.';
          button.disabled = false;
          button.textContent = previousLabel;
        }
      }

'''
          text = text.replace(anchor, bridge + anchor, 1)

          listener_anchor = "      byId('heroStartButton').addEventListener('click', openDashboardPrimaryAction);"
          listener = "      byId('workshopShortcutButton').addEventListener('click', openWorkPanel);\n"
          if listener_anchor not in text:
              raise SystemExit('listener anchor not found')
          text = text.replace(listener_anchor, listener + listener_anchor, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Run focused handoff regression test
        run: node --test tests/legacy-handoff.test.mjs

      - name: Remove one-shot workflow from resulting commit
        run: rm .github/workflows/one-shot-student-work-sso.yml

      - name: Commit safe branch patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps-script/Index.html .github/workflows/one-shot-student-work-sso.yml
          git commit -m 'Wire campus shortcut to secure work-panel handoff'
          git push origin HEAD:fix/student-work-sso
