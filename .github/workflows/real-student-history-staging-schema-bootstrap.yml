name: CZA Real Student History Staging Schema Bootstrap

on:
  push:
    branches:
      - feature/real-student-history-v1
    paths:
      - '.github/workflows/real-student-history-staging-schema-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-approved-ledger-migration:
    runs-on: cza-history-bootstrap-c0507fa1
    timeout-minutes: 10
    environment: CZA-STAGING-SECURITY
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        shell: powershell
        run: corepack.cmd pnpm install --frozen-lockfile

      - name: Apply and verify approved canonical ledger migration
        env:
          CZA_STAGING_DATABASE_URL: ${{ secrets.CZA_STAGING_DATABASE_URL }}
        shell: powershell
        run: node scripts/qa/apply-staging-ledger-migration.mjs
