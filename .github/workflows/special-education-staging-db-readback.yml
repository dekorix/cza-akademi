name: CZA Special Education Staging DB Readback

on:
  push:
    branches:
      - feature/special-education-dyslexia-v1
    paths:
      - 'scripts/qa/special-staging-db-readback.mjs'
      - 'scripts/qa/special-program-staging-proof.mjs'
      - 'db/migrations/20261005_special_education_programs_v1.sql'
      - 'db/migrations/20261005_special_education_program_sessions_v1.sql'
      - 'db/migrations/20261005_special_education_reassessments_v1.sql'
      - 'db/migrations/20261005_student_package_entitlements_v1.sql'
      - 'db/migrations/20261006_memory_module_v1.sql'
      - 'lib/special-reassessment.ts'
      - 'lib/special-daily-work.ts'
      - '.github/workflows/special-education-staging-db-readback.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/qa/special-staging-db-readback.mjs'
      - '.github/workflows/special-education-staging-db-readback.yml'
  workflow_dispatch:
    inputs:
      t5_action:
        description: T5 pre-enrollment isolated staging action
        required: true
        type: choice
        default: legacy
        options:
          - legacy
          - preflight
          - apply
          - ui_readback
          - ui_two_candidates

permissions:
  contents: read

concurrency:
  group: cza-special-staging-db
  cancel-in-progress: false

jobs:
  staging-db-readback:
    if: (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref != 'fix/t5-pre-enroll-resume-integrity')) && (github.event_name != 'workflow_dispatch' || inputs.t5_action == 'legacy')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: CZA-STAGING-SECURITY
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.13.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify staging secret is explicitly present
        env:
          CZA_STAGING_DATABASE_URL: ${{ secrets.CZA_STAGING_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CZA_STAGING_DATABASE_URL:-}" ]; then
            echo "STAGING_DB_READBACK=BLOCKED"
            echo "REASON=CZA_STAGING_DATABASE_URL_MISSING"
            exit 2
          fi

      - name: Run synthetic write readback and cleanup
        env:
          CZA_STAGING_DATABASE_URL: ${{ secrets.CZA_STAGING_DATABASE_URL }}
        run: node scripts/qa/special-staging-db-readback.mjs
  

  special-program-staging-proof:
    if: (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref != 'fix/t5-pre-enroll-resume-integrity')) && (github.event_name != 'workflow_dispatch' || inputs.t5_action == 'legacy')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: CZA-STAGING-SECURITY
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.13.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate exact staging target
        env:
          CZA_STAGING_DATABASE_URL: ${{ secrets.CZA_STAGING_DATABASE_URL }}
        run: |
          node -e "const u=new URL(process.env.CZA_STAGING_DATABASE_URL||''); if(!u.hostname.endsWith('.neon.tech')||u.pathname!=='/cza_learning') process.exit(2); console.log('STAGING_TARGET=PASS')"

      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi

      - name: Apply additive special program migrations
        env:
          CZA_STAGING_DATABASE_URL: ${{ secrets.CZA_STAGING_DATABASE_URL }}
        run: |
          psql "$CZA_STAGING_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/20261005_special_education_programs_v1.sql
          psql "$CZA_STAGING_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/20261005_special_education_program_sessions_v1.sql
          psql "$CZA_STAGING_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/20261005_special_education_reassessments_v1.sql
          psql "$CZA_STAGING_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/20261005_student_package_entitlements_v1.sql
          psql "$CZA_STAGING_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/20261006_memory_module_v1.sql

      - name: Verify migration objects
        env:
          CZA_STAGING_DATABASE_URL: ${{ secrets.CZA_STAGING_DATABASE_URL }}
        run: |
          test "$(psql "$CZA_STAGING_DATABASE_URL" -Atc "SELECT to_regclass('public.special_education_programs')::text")" = "special_education_programs"
          test "$(psql "$CZA_STAGING_DATABASE_URL" -Atc "SELECT to_regclass('public.special_education_program_sessions')::text")" = "special_education_program_sessions"
          test "$(psql "$CZA_STAGING_DATABASE_URL" -Atc "SELECT to_regclass('public.special_education_reassessments')::text")" = "special_education_reassessments"
          test "$(psql "$CZA_STAGING_DATABASE_URL" -Atc "SELECT to_regclass('public.student_package_decisions')::text")" = "student_package_decisions"
          test "$(psql "$CZA_STAGING_DATABASE_URL" -Atc "SELECT to_regclass('public.student_package_enrollments')::text")" = "student_package_enrollments"
          test "$(psql "$CZA_STAGING_DATABASE_URL" -Atc "SELECT to_regclass('public.student_access_entitlements')::text")" = "student_access_entitlements"
          test "$(psql "$CZA_STAGING_DATABASE_URL" -Atc "SELECT count(*) FROM public.modules WHERE code='memory' AND name='Hafıza Teknikleri' AND category='zihin' AND is_active=true")" = "1"
          echo "SPECIAL_PROGRAM_SCHEMA=PASS"
          echo "SPECIAL_DAILY_SESSION_SCHEMA=PASS"
          echo "SPECIAL_REASSESSMENT_SCHEMA=PASS"
          echo "PACKAGE_DECISION_SCHEMA=PASS"
          echo "PACKAGE_ENROLLMENT_SCHEMA=PASS"
          echo "STUDENT_ENTITLEMENT_SCHEMA=PASS"
          echo "MEMORY_MODULE_CATALOG=PASS"

      - name: Synthetic program write readback cleanup
        env:
          CZA_STAGING_DATABASE_URL: ${{ secrets.CZA_STAGING_DATABASE_URL }}
        run: node --experimental-strip-types scripts/qa/special-program-staging-proof.mjs

  t5-pre-enroll:
    if: github.event_name == 'workflow_dispatch' && (inputs.t5_action == 'preflight' || inputs.t5_action == 'apply' || inputs.t5_action == 'ui_readback' || inputs.t5_action == 'ui_two_candidates' || inputs.t5_action == 'ui_two_candidates')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: CZA-STAGING-SECURITY
    steps:
      - name: Checkout exact T5 branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify staging target and read-only preflight
        if: inputs.t5_action != 'ui_readback'
        env:
          CZA_STAGING_DATABASE_URL: ${{ secrets.CZA_STAGING_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CZA_STAGING_DATABASE_URL:-}"
          node -e "const u=new URL(process.env.CZA_STAGING_DATABASE_URL); const h=u.hostname.toLowerCase(); if(!h.endsWith('.neon.tech') || u.pathname!=='/cza_learning' || /(^|[.-])(prod|production)([.-]|$)/.test(h)) process.exit(2); console.log('T5_STAGING_URL_SHAPE=PASS')"
          export PGOPTIONS='-c default_transaction_read_only=on'
          test "$(psql "$CZA_STAGING_DATABASE_URL" -Atc "SELECT to_regclass('public.assessment_sessions')::text")" = "assessment_sessions"
          conflicts="$(psql "$CZA_STAGING_DATABASE_URL" -Atc "SELECT count(*) FROM (SELECT 1 FROM public.assessment_sessions WHERE student_id IS NULL AND status='active' AND metadata->>'source'='EDUCATOR_PRE_ENROLLMENT' AND metadata->>'candidateId' IS NOT NULL AND metadata->>'cycleId' IS NOT NULL GROUP BY metadata->>'academyId', metadata->>'createdByEducatorId', metadata->>'candidateId', metadata->>'cycleId', template_code HAVING count(*)>1) collisions")"
          echo "T5_EXISTING_IDENTITY_COLLISIONS=$conflicts"
          test "$conflicts" = "0"
          psql "$CZA_STAGING_DATABASE_URL" -Atc "SELECT 'T5_DB='||current_database()||'|STAGING_ACADEMIES='||count(*) FROM public.academies WHERE environment='staging'"
          echo "T5_PREFLIGHT=PASS"
      - name: Apply approved T5 unique index to isolated staging
        if: inputs.t5_action == 'apply'
        env:
          CZA_STAGING_DATABASE_URL: ${{ secrets.CZA_STAGING_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          psql "$CZA_STAGING_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/20261008_t5_pre_enroll_active_identity_staging.sql
          test "$(psql "$CZA_STAGING_DATABASE_URL" -Atc "SELECT count(*) FROM pg_index i JOIN pg_class c ON c.oid=i.indexrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relname='assessment_sessions_pre_enroll_active_identity_uq' AND i.indisunique AND i.indisvalid")" = "1"
          echo "T5_STAGING_INDEX=PASS"
      - name: Enable Corepack for T5 readback
        if: inputs.t5_action == 'apply' || inputs.t5_action == 'ui_readback' || inputs.t5_action == 'ui_two_candidates'
        run: corepack enable
      - name: Setup Node for T5 readback
        if: inputs.t5_action == 'apply' || inputs.t5_action == 'ui_readback' || inputs.t5_action == 'ui_two_candidates'
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install T5 readback dependencies
        if: inputs.t5_action == 'apply' || inputs.t5_action == 'ui_readback' || inputs.t5_action == 'ui_two_candidates'
        run: pnpm install --frozen-lockfile
      - name: Synthetic concurrent sessions and central readback
        if: inputs.t5_action == 'apply'
        env:
          CZA_STAGING_DATABASE_URL: ${{ secrets.CZA_STAGING_DATABASE_URL }}
        run: node scripts/qa/t5-pre-enroll-staging-readback.mjs
      - name: Verify browser session evidence in central staging and clean synthetic data
        if: inputs.t5_action == 'ui_readback'
        env:
          CZA_STAGING_DATABASE_URL: ${{ secrets.CZA_STAGING_DATABASE_URL }}
        run: node scripts/qa/t5-ui-central-readback.mjs
      - name: Verify two same-name browser candidates and clean synthetic data
        if: inputs.t5_action == 'ui_two_candidates'
        env:
          CZA_STAGING_DATABASE_URL: ${{ secrets.CZA_STAGING_DATABASE_URL }}
        run: node scripts/qa/t5-ui-two-candidates-readback.mjs
