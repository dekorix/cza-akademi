name: CZA Memory Browser Acceptance

on:
  push:
    branches:
      - feature/memory-techniques-v1
    paths:
      - 'app/memory/**'
      - 'components/package-access-gate.tsx'
      - 'lib/memory-techniques.ts'
      - 'lib/package-catalog.ts'
      - 'app/api/core/route.ts'
      - 'tests/memory-browser-acceptance.spec.cjs'
      - '.github/workflows/memory-browser-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.13.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: |
          pnpm add -Dw @playwright/test@1.52.0 --lockfile=false
          pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Start built app
        run: |
          pnpm exec wrangler dev --config dist/server/wrangler.json --port 8787 > /tmp/cza-memory-preview.log 2>&1 &
          echo $! > /tmp/cza-memory-preview.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/memory > /tmp/memory.html; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cza-memory-preview.log
          exit 1

      - name: Run desktop and mobile memory flow
        env:
          CZA_BASE_URL: http://127.0.0.1:8787
        run: pnpm exec playwright test tests/memory-browser-acceptance.spec.cjs --reporter=line --workers=1

      - name: Upload memory screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cza-memory-browser-acceptance
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
