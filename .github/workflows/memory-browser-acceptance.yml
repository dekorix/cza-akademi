name: CZA Memory Browser Acceptance

on:
  push:
    branches:
      - feature/memory-techniques-v1
    paths:
      - 'app/memory/**'
      - 'components/package-access-gate.tsx'
      - 'lib/memory-techniques.ts'
      - 'lib/package-catalog.ts'
      - 'app/api/core/route.ts'
      - 'tests/memory-browser-acceptance.spec.cjs'
      - '.github/workflows/memory-browser-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.52.0
          npx playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Start built app
        run: |
          pnpm exec wrangler dev --config dist/server/wrangler.json --port 8787 > /tmp/cza-memory-preview.log 2>&1 &
          echo $! > /tmp/cza-memory-preview.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/memory > /tmp/memory.html; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cza-memory-preview.log
          exit 1

      - name: Run desktop and mobile memory flow
        env:
          CZA_BASE_URL: http://127.0.0.1:8787
        run: npx playwright test tests/memory-browser-acceptance.spec.cjs --reporter=line --workers=1

      - name: Upload memory screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cza-memory-browser-acceptance
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
