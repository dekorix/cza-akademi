name: CZA Effective Notes Staging Catalog

on:
  push:
    branches:
      - feature/effective-notes-v1
    paths:
      - 'db/migrations/20261006_effective_notes_module_v1.sql'
      - 'lib/effective-notes.ts'
      - 'lib/package-catalog.ts'
      - '.github/workflows/effective-notes-staging-catalog.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  effective-notes-staging-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: CZA-STAGING-SECURITY
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - env:
          CZA_STAGING_DATABASE_URL: ${{ secrets.CZA_STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "${CZA_STAGING_DATABASE_URL:-}"
          psql "$CZA_STAGING_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/20261006_effective_notes_module_v1.sql
          result="$(psql "$CZA_STAGING_DATABASE_URL" -Atc "SELECT code || '|' || name || '|' || category || '|' || is_active::text FROM public.modules WHERE code='effective_notes' LIMIT 1")"
          test "$result" = "effective_notes|Etkili Not Alma|zihin|true"
          echo "EFFECTIVE_NOTES_MODULE_CATALOG=PASS"
