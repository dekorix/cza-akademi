name: CZA T5 Staging Index Read-only Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/qa/t5-staging-index-readonly.mjs'
      - '.github/workflows/cza-t5-staging-index-readonly.yml'

permissions:
  contents: read

jobs:
  read-only-index-catalog:
    if: github.event.pull_request.number == 73 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: CZA-STAGING-SECURITY
    steps:
      - name: Checkout exact candidate without write credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Enable Corepack
        run: corepack enable
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.13.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify actual staging secret target and canonical index via SELECT only
        env:
          CZA_STAGING_DATABASE_URL: ${{ secrets.CZA_STAGING_DATABASE_URL }}
        run: node scripts/qa/t5-staging-index-readonly.mjs
