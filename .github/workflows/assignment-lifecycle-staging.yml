name: CZA Assignment Lifecycle Staging

on:
  push:
    branches:
      - feature/assignment-lifecycle-v1
    paths:
      - 'scripts/qa/assignment-lifecycle-staging.mjs'
      - '.github/workflows/assignment-lifecycle-staging.yml'
      - 'app/api/core/assignments/route.ts'
      - 'app/api/educator-assignments/route.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assignment-lifecycle-staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: CZA-STAGING-SECURITY
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assignment lifecycle transactional staging acceptance
        env:
          CZA_STAGING_DATABASE_URL: ${{ secrets.CZA_STAGING_DATABASE_URL }}
        run: node scripts/qa/assignment-lifecycle-staging.mjs
