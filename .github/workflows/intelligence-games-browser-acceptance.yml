name: CZA Intelligence Games Browser Acceptance
on:
  push:
    branches: [feature/intelligence-games-v1]
    paths:
      - 'app/intelligence-games/**'
      - 'lib/intelligence-games.ts'
      - 'lib/package-catalog.ts'
      - 'tests/intelligence-games-browser-acceptance.spec.cjs'
      - '.github/workflows/intelligence-games-browser-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install isolated Playwright Chromium
        run: |
          npm install --prefix /tmp/cza-pw --package-lock=false @playwright/test@1.52.0
          /tmp/cza-pw/node_modules/.bin/playwright install --with-deps chromium
      - run: pnpm build
      - run: |
          pnpm exec wrangler dev --config dist/server/wrangler.json --port 8787 > /tmp/cza-intelligence-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/intelligence-games > /tmp/intelligence-games.html; then exit 0; fi
            sleep 1
          done
          cat /tmp/cza-intelligence-preview.log
          exit 1
      - name: Run desktop and mobile intelligence flow
        env:
          CZA_BASE_URL: http://127.0.0.1:8787
        run: NODE_PATH=/tmp/cza-pw/node_modules /tmp/cza-pw/node_modules/.bin/playwright test tests/intelligence-games-browser-acceptance.spec.cjs --reporter=line --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cza-intelligence-games-browser-acceptance
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
