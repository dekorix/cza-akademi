name: CZA Assessment CI

on:
  push:
    branches:
      - cza-assessment-engine-v1
      - cza-core-integration-v1
      - cza-e3-36-48-v1
      - cza-assessment-e3-content-v2
      - feature/memory-techniques-v1
      - feature/attention-focus-v1
      - feature/speed-reading-v1
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

      - name: Targeted CZA Core integration tests
        run: node --experimental-strip-types --test tests/core-records.test.mjs tests/work-student-id-integration.test.mjs tests/cza-work-recommendations.test.mjs tests/real-assignment-auth-integration.test.mjs tests/educator-auth-route.test.mjs tests/e3-development-assessment.test.mjs tests/e3-assessment-content-v2.test.mjs tests/special-assessment-contract.test.mjs tests/special-learning-profile.test.mjs tests/special-education-program.test.mjs tests/special-education-program-auth.test.mjs tests/special-daily-work.test.mjs tests/special-daily-work-auth.test.mjs tests/special-reassessment.test.mjs tests/special-reassessment-auth.test.mjs tests/special-parent-report.test.mjs tests/special-family-report-auth.test.mjs tests/package-catalog.test.mjs tests/package-enrollment-auth.test.mjs tests/memory-techniques.test.mjs tests/attention-focus.test.mjs tests/speed-reading.test.mjs

      - name: Start built app
        run: |
          pnpm exec wrangler dev --config dist/server/wrangler.json --port 8787 > /tmp/cza-preview.log 2>&1 &
          echo $! > /tmp/cza-preview.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/educator/assessment > /tmp/assessment-educator.html; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cza-preview.log
          exit 1

      - name: Smoke test assessment and educator auth routes
        run: |
          curl -fsS http://127.0.0.1:8787/assessment > /tmp/assessment-student.html
          curl -fsS http://127.0.0.1:8787/assessment/e3 > /tmp/assessment-e3.html
          curl -fsS http://127.0.0.1:8787/educator/assessment > /tmp/assessment-educator.html
          curl -fsS http://127.0.0.1:8787/educator/assessment/report > /tmp/assessment-report.html
          curl -fsS http://127.0.0.1:8787/educator/special-program > /tmp/special-program.html
          curl -fsS http://127.0.0.1:8787/educator/special-reassessment > /tmp/special-reassessment.html
          curl -fsS http://127.0.0.1:8787/educator/family-report > /tmp/family-report.html
          curl -fsS http://127.0.0.1:8787/educator/enrollment > /tmp/enrollment.html
          curl -fsS http://127.0.0.1:8787/learn > /tmp/learn.html
          curl -fsS http://127.0.0.1:8787/memory > /tmp/memory.html
          curl -fsS http://127.0.0.1:8787/attention > /tmp/attention.html
          curl -fsS http://127.0.0.1:8787/speed-reading > /tmp/speed-reading.html
          curl -fsS http://127.0.0.1:8787/special-work > /tmp/special-work.html
          curl -fsS http://127.0.0.1:8787/educator/assessment/e3/report > /tmp/assessment-e3-report.html
          curl -fsS http://127.0.0.1:8787/work > /tmp/work.html
          curl -fsS http://127.0.0.1:8787/educator > /tmp/educator.html
          curl -fsS http://127.0.0.1:8787/api/educator-auth > /tmp/educator-auth.json
          test -s /tmp/assessment-student.html
          test -s /tmp/assessment-e3.html
          test -s /tmp/assessment-educator.html
          test -s /tmp/assessment-report.html
          test -s /tmp/special-program.html
          test -s /tmp/special-reassessment.html
          test -s /tmp/family-report.html
          test -s /tmp/enrollment.html
          test -s /tmp/learn.html
          test -s /tmp/memory.html
          test -s /tmp/attention.html
          test -s /tmp/speed-reading.html
          test -s /tmp/special-work.html
          test -s /tmp/assessment-e3-report.html
          test -s /tmp/work.html
          test -s /tmp/educator.html
          grep -F '"ok":true' /tmp/educator-auth.json
          grep -F '"service":"cza-educator-auth"' /tmp/educator-auth.json
          grep -F '"build":"2026-09-12-reset-autologin-v1"' /tmp/educator-auth.json

      # The repository has existing lint debt. Keep integration-only lint visible while
      # typecheck, production build and runtime smoke tests remain the merge blockers.
      - name: Lint integration changes
        continue-on-error: true
        run: >-
          pnpm exec oxlint --format unix
          app/assessment
          app/educator/assessment
          app/educator/special-program
          app/educator/special-reassessment
          app/educator/family-report
          app/educator/enrollment
          app/memory
          app/attention
          app/speed-reading
          app/special-work
          app/assignment
          app/api/core
          app/api/assessment-e3
          app/api/assessment-e3-linked
          app/api/assessment-special-linked
          app/api/educator-special-programs
          app/api/educator-special-reassessment
          app/api/educator-special-family-report
          app/api/educator-enrollment
          app/api/core/access
          app/api/core/special-program
          app/api/educator-auth
          app/api/educator-assignments
          app/api/educator-report/route.ts
          app/studio/page.tsx
          app/work/page.tsx
          components/assessment-report.tsx
          components/assigned-work-banner.tsx
          components/central-student-report.tsx
          components/educator-students.tsx
          lib/assessment-engine.ts
          lib/assessment-routing.ts
          lib/assessment-math.ts
          lib/assessment-math-extended.ts
          lib/assessment-language.ts
          lib/assessment-cognitive.ts
          lib/assessment-learning-response.ts
          lib/assessment-report.ts
          lib/special-assessment.ts
          lib/special-learning-profile.ts
          lib/special-education-program.ts
          lib/special-daily-work.ts
          lib/special-reassessment.ts
          lib/special-parent-report.ts
          lib/package-catalog.ts
          lib/memory-techniques.ts
          lib/attention-focus.ts
          lib/speed-reading.ts
          components/package-access-gate.tsx
          lib/preschool-e3.ts
          lib/preschool-e3-protocol.ts
          lib/cza-work-recommendations.ts
          lib/assigned-session.ts
          lib/educator-auth.ts
          lib/student-session.ts
          lib/training-recipes.ts
          types/http-json.d.ts
