name: CZA Assessment CI

on:
  push:
    branches:
      - cza-assessment-engine-v1
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

      - name: Lint assessment changes
        run: >-
          pnpm exec oxlint --format unix
          app/assessment
          app/educator/assessment
          components/assessment-report.tsx
          lib/assessment-engine.ts
          lib/assessment-routing.ts
          lib/assessment-math.ts
          lib/assessment-math-extended.ts
          lib/assessment-language.ts
          lib/assessment-cognitive.ts
          lib/assessment-learning-response.ts
          lib/assessment-report.ts
          types/http-json.d.ts
