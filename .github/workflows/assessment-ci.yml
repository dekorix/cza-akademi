name: CZA Assessment CI

on:
  push:
    branches:
      - cza-assessment-engine-v1
      - cza-core-integration-v1
      - cza-e3-36-48-v1
      - cza-assessment-e3-content-v2
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CZA_TRUSTED_PROXY_HMAC_SECRET: cza-ci-only-proxy-secret-with-at-least-32-bytes
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.13.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

      - name: Targeted CZA Core integration tests
        run: node --test tests/core-records.test.mjs tests/work-student-id-integration.test.mjs tests/cza-work-recommendations.test.mjs tests/real-assignment-auth-integration.test.mjs tests/educator-auth-route.test.mjs tests/e3-development-assessment.test.mjs tests/e3-assessment-content-v2.test.mjs

      - name: Start built app
        run: |
          pnpm exec wrangler dev --config dist/server/wrangler.json --port 8787 > /tmp/cza-preview.log 2>&1 &
          echo $! > /tmp/cza-preview.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/educator/assessment > /tmp/assessment-educator.html; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cza-preview.log
          exit 1

      - name: Smoke test assessment and educator auth routes
        run: |
          curl -fsS http://127.0.0.1:8787/assessment > /tmp/assessment-student.html
          curl -fsS http://127.0.0.1:8787/assessment/e3 > /tmp/assessment-e3.html
          curl -fsS http://127.0.0.1:8787/educator/assessment > /tmp/assessment-educator.html
          curl -fsS http://127.0.0.1:8787/educator/assessment/report > /tmp/assessment-report.html
          curl -fsS http://127.0.0.1:8787/educator/assessment/e3/report > /tmp/assessment-e3-report.html
          curl -fsS http://127.0.0.1:8787/work > /tmp/work.html
          curl -fsS http://127.0.0.1:8787/educator > /tmp/educator.html
          forged_status=$(curl -sS -o /tmp/educator-auth-forged.json -w '%{http_code}' \
            -H 'oai-authenticated-user-email: habipcann65@gmail.com' \
            http://127.0.0.1:8787/api/educator-auth)
          test "$forged_status" = '403'
          grep -F '"error":"trusted_proxy_required"' /tmp/educator-auth-forged.json
          read -r cza_proxy_timestamp cza_proxy_nonce cza_proxy_signature < <(node - <<'NODE'
          const { createHash, createHmac, randomBytes } = require('node:crypto');
          const timestamp = String(Math.floor(Date.now() / 1000));
          const nonce = randomBytes(16).toString('hex');
          const bodySha256 = createHash('sha256').update('').digest('hex');
          const payload = [
            'cza-educator-proxy-v2',
            timestamp,
            nonce,
            'GET',
            '/api/educator-auth',
            bodySha256,
            '',
          ].join('\n');
          const signature = createHmac(
            'sha256',
            process.env.CZA_TRUSTED_PROXY_HMAC_SECRET,
          ).update(payload).digest('hex');
          process.stdout.write(`${timestamp} ${nonce} ${signature}\n`);
          NODE
          )
          signed_without_nonce_store_status=$(curl -sS \
            -o /tmp/educator-auth-no-nonce-store.json \
            -w '%{http_code}' \
            -H "x-cza-proxy-timestamp: $cza_proxy_timestamp" \
            -H "x-cza-proxy-nonce: $cza_proxy_nonce" \
            -H "x-cza-proxy-signature: $cza_proxy_signature" \
            http://127.0.0.1:8787/api/educator-auth)
          test "$signed_without_nonce_store_status" = '403'
          grep -F '"error":"trusted_proxy_required"' /tmp/educator-auth-no-nonce-store.json
          grep -F '"build":"2026-09-14-auth-hardening-v2.2"' /tmp/educator-auth-no-nonce-store.json
          test -s /tmp/assessment-student.html
          test -s /tmp/assessment-e3.html
          test -s /tmp/assessment-educator.html
          test -s /tmp/assessment-report.html
          test -s /tmp/assessment-e3-report.html
          test -s /tmp/work.html
          test -s /tmp/educator.html

      # The repository has existing lint debt. Keep integration-only lint visible while
      # typecheck, production build and runtime smoke tests remain the merge blockers.
      - name: Lint integration changes
        continue-on-error: true
        run: >-
          pnpm exec oxlint --format unix
          app/assessment
          app/educator/assessment
          app/assignment
          app/api/core
          app/api/assessment-e3
          app/api/assessment-e3-linked
          app/api/educator-auth
          app/api/educator-assignments
          app/api/educator-report/route.ts
          app/studio/page.tsx
          app/work/page.tsx
          components/assessment-report.tsx
          components/assigned-work-banner.tsx
          components/central-student-report.tsx
          components/educator-students.tsx
          lib/assessment-engine.ts
          lib/assessment-routing.ts
          lib/assessment-math.ts
          lib/assessment-math-extended.ts
          lib/assessment-language.ts
          lib/assessment-cognitive.ts
          lib/assessment-learning-response.ts
          lib/assessment-report.ts
          lib/preschool-e3.ts
          lib/preschool-e3-protocol.ts
          lib/cza-work-recommendations.ts
          lib/assigned-session.ts
          lib/educator-auth.ts
          lib/student-session.ts
          lib/training-recipes.ts
          types/http-json.d.ts
