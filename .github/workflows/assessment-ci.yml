name: CZA Assessment CI

on:
  push:
    branches:
      - cza-assessment-engine-v1
      - cza-core-integration-v1
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

      - name: Targeted CZA Core integration tests
        run: node --test tests/core-records.test.mjs tests/work-student-id-integration.test.mjs tests/cza-work-recommendations.test.mjs tests/real-assignment-auth-integration.test.mjs

      - name: Start built app
        run: |
          pnpm exec wrangler dev --config dist/server/wrangler.json --port 8787 > /tmp/cza-preview.log 2>&1 &
          echo $! > /tmp/cza-preview.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/educator/assessment > /tmp/assessment-educator.html; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cza-preview.log
          exit 1

      - name: Smoke test assessment routes
        run: |
          curl -fsS http://127.0.0.1:8787/assessment > /tmp/assessment-student.html
          curl -fsS http://127.0.0.1:8787/educator/assessment > /tmp/assessment-educator.html
          curl -fsS http://127.0.0.1:8787/educator/assessment/report > /tmp/assessment-report.html
          curl -fsS http://127.0.0.1:8787/work > /tmp/work.html
          curl -fsS http://127.0.0.1:8787/educator > /tmp/educator.html
          test -s /tmp/assessment-student.html
          test -s /tmp/assessment-educator.html
          test -s /tmp/assessment-report.html
          test -s /tmp/work.html
          test -s /tmp/educator.html

      # The repository has existing lint debt. Keep integration-only lint visible while
      # typecheck, production build and runtime smoke tests remain the merge blockers.
      - name: Lint integration changes
        continue-on-error: true
        run: >-
          pnpm exec oxlint --format unix
          app/assessment
          app/educator/assessment
          app/assignment
          app/api/core
          app/api/educator-auth
          app/api/educator-assignments
          app/api/educator-report/route.ts
          app/studio/page.tsx
          app/work/page.tsx
          components/assessment-report.tsx
          components/assigned-work-banner.tsx
          components/central-student-report.tsx
          components/educator-students.tsx
          lib/assessment-engine.ts
          lib/assessment-routing.ts
          lib/assessment-math.ts
          lib/assessment-math-extended.ts
          lib/assessment-language.ts
          lib/assessment-cognitive.ts
          lib/assessment-learning-response.ts
          lib/assessment-report.ts
          lib/cza-work-recommendations.ts
          lib/assigned-session.ts
          lib/educator-auth.ts
          lib/student-session.ts
          lib/training-recipes.ts
          types/http-json.d.ts
