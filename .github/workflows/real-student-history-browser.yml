name: CZA Real Student History Browser Acceptance

on:
  push:
    branches:
      - feature/real-student-history-v1
    paths:
      - 'app/api/core/route.ts'
      - 'app/api/student-history/route.ts'
      - 'app/api/educator-report/route.ts'
      - 'components/student-learning-history.tsx'
      - 'components/central-student-report.tsx'
      - 'scripts/qa/real-student-history-browser.mjs'
      - 'tests/student-history-integration.test.mjs'
      - '.github/workflows/real-student-history-browser.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/api/core/route.ts'
      - 'app/api/student-history/route.ts'
      - 'app/api/educator-report/route.ts'
      - 'components/student-learning-history.tsx'
      - 'components/central-student-report.tsx'
      - 'scripts/qa/real-student-history-browser.mjs'
      - 'tests/student-history-integration.test.mjs'
      - '.github/workflows/real-student-history-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-hard-reload:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: CZA-STAGING-SECURITY
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Syntax and focused regression guard
        run: |
          node --check scripts/qa/real-student-history-browser.mjs
          node --test tests/student-history-integration.test.mjs

      - name: Build exact head
        run: pnpm build

      - name: Start staging-bound built app
        env:
          CZA_STAGING_DATABASE_URL: ${{ secrets.CZA_STAGING_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CZA_STAGING_DATABASE_URL:-}" ]; then
            echo "REAL_HISTORY_BROWSER=BLOCKED"
            echo "REASON=CZA_STAGING_DATABASE_URL_MISSING"
            exit 2
          fi
          printf 'DATABASE_URL=%s\n' "${CZA_STAGING_DATABASE_URL}" > dist/server/.dev.vars
          chmod 600 dist/server/.dev.vars
          pnpm exec wrangler dev --config dist/server/wrangler.json --port 8787 > /tmp/cza-history-browser-app.log 2>&1 &
          echo $! > /tmp/cza-history-browser-app.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/work > /tmp/cza-history-browser-work.html; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cza-history-browser-app.log
          exit 1

      - name: Authenticated browser and hard reload acceptance
        env:
          CZA_STAGING_DATABASE_URL: ${{ secrets.CZA_STAGING_DATABASE_URL }}
          CZA_BROWSER_BASE_URL: http://127.0.0.1:8787
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "${CHROME_BIN}" ]; then
            echo "REAL_HISTORY_BROWSER=BLOCKED"
            echo "REASON=CHROME_NOT_AVAILABLE"
            exit 2
          fi
          export CHROME_BIN
          "${CHROME_BIN}" --version
          node scripts/qa/real-student-history-browser.mjs

      - name: Stop built app
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/cza-history-browser-app.pid ]; then
            kill "$(cat /tmp/cza-history-browser-app.pid)" 2>/dev/null || true
          fi
          rm -f dist/server/.dev.vars
