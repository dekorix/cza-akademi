name: CZA Speed Reading Staging Catalog

on:
  push:
    branches:
      - feature/speed-reading-v1
    paths:
      - 'db/migrations/20261006_speed_reading_module_v1.sql'
      - 'lib/speed-reading.ts'
      - 'lib/package-catalog.ts'
      - '.github/workflows/speed-reading-staging-catalog.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  speed-reading-staging-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: CZA-STAGING-SECURITY
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Verify staging secret
        env:
          CZA_STAGING_DATABASE_URL: ${{ secrets.CZA_STAGING_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CZA_STAGING_DATABASE_URL:-}"
      - name: Apply speed-reading catalog migration
        env:
          CZA_STAGING_DATABASE_URL: ${{ secrets.CZA_STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          psql "$CZA_STAGING_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/20261006_speed_reading_module_v1.sql
      - name: Verify canonical speed-reading module
        env:
          CZA_STAGING_DATABASE_URL: ${{ secrets.CZA_STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          result="$(psql "$CZA_STAGING_DATABASE_URL" -Atc "SELECT code || '|' || name || '|' || category || '|' || is_active::text FROM public.modules WHERE code='speed_reading' LIMIT 1")"
          test "$result" = "speed_reading|Hızlı Okuma|zihin|true"
          echo "SPEED_READING_MODULE_CATALOG=PASS"
