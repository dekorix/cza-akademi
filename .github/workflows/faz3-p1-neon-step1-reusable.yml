name: Faz3 P1 Neon Step 1 reusable

on:
  workflow_call:
    inputs:
      authorize_p1:
        type: boolean
        required: true
      p0c_attestation_sha256:
        type: string
        required: true

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: cza-faz3-p1-neon-step1
  cancel-in-progress: false

jobs:
  native-provider-proof-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout P1 trust gate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: b54658a3b613534c75a541a653195260c54afd46
          persist-credentials: false
      - name: Verify immutable trust-gate code
        shell: bash
        run: |
          set -euo pipefail
          echo 'd14a320790442ccc0feb81789fe0c4c5324ad071af9147ea04ae4f50adde337b  scripts/faz3/verify-p1-native-proof-manifest.mjs' | sha256sum --check --strict
          echo '66653eb48cc31726eb5b1c3037c757f8effe9ba2a32055b9f2a021bf0dbb5cf6  security/faz3/attestation/trust-roots.json' | sha256sum --check --strict
          echo '41316af76d7b8c4b1f30671f78c79bd3cc33d18296b1c4255ee19cae7b61dd00  security/faz3/attestation/public-keys/8f236703a3e286b8ca0b8860215a1773aad760df5e6aff2f35600b2e4e44b635.pem' | sha256sum --check --strict
          echo '10d0b836cde63ab82b5ea341adfd463fc9124c3d8390348fc42105c1b0bb7218  scripts/faz3/verify-b1-native-provider-proof.mjs' | sha256sum --check --strict
          echo '631b2d87769281b9e3fda585a6f3c5fb7c68276535d5955a12fc151b39d9ac07  security/faz3/attestation/verify-manifest-attestation.mjs' | sha256sum --check --strict
          echo 'ed6490b1c55568c6d62fe065aa112004b2146878a7d324d7feccafcedf56f9ed  security/faz3/attestation/jcs.mjs' | sha256sum --check --strict
          echo '557ec3387f6b56d83ec74622dc4e59231a80dad2355b5bac6ab7f50ebd1f9be6  scripts/faz3/verify-p1-orphan-wal.mjs' | sha256sum --check --strict
          echo '9a8c57a0ddd27a04598d0a83edd90e33cb2b49a7b63fdc45e33eebb1a7b765f6  security/faz3/recovery/reconciliations/35067500579-01K2KH2DCA2448770B9A359BE9.json' | sha256sum --check --strict
      - name: Reject unresolved P1 WAL before proof consumption
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/faz3/verify-p1-orphan-wal.mjs
      - name: Verify signed Manifest v4 and derive proof locator
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          node scripts/faz3/verify-p1-native-proof-manifest.mjs \
            --manifest=delivery/CZA_Faz3_Delivery_Manifest_v4.json \
            --github-output="$GITHUB_OUTPUT"
      - name: Validate manifest-bound run and artifact metadata
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROOF_RUN_ID: ${{ steps.manifest.outputs.proof_run_id }}
          PROOF_ARTIFACT_ID: ${{ steps.manifest.outputs.proof_artifact_id }}
          PROOF_NAME: ${{ steps.manifest.outputs.proof_artifact_name }}
          PROOF_DIGEST: ${{ steps.manifest.outputs.proof_artifact_digest }}
          APPLICATION_COMMIT: ${{ steps.manifest.outputs.application_commit }}
        run: |
          set -euo pipefail
          [[ "$PROOF_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PROOF_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${PROOF_RUN_ID}/artifacts?name=${PROOF_NAME}&per_page=100" \
            > "$RUNNER_TEMP/b1-artifacts.json"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${PROOF_RUN_ID}" \
            > "$RUNNER_TEMP/b1-run.json"
          node scripts/faz3/verify-b1-native-provider-proof.mjs \
            --metadata="$RUNNER_TEMP/b1-artifacts.json" \
            --run-metadata="$RUNNER_TEMP/b1-run.json" \
            --expected-name="$PROOF_NAME" \
            --expected-digest="$PROOF_DIGEST" \
            --expected-artifact-id="$PROOF_ARTIFACT_ID" \
            --expected-run-id="$PROOF_RUN_ID" \
            --expected-commit="$APPLICATION_COMMIT" \
            --expected-repository="$GITHUB_REPOSITORY"
      - name: Download exact-run native provider proof
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.manifest.outputs.proof_artifact_name }}
          path: ${{ runner.temp }}/b1-native-provider-proof
          github-token: ${{ github.token }}
          run-id: ${{ steps.manifest.outputs.proof_run_id }}
      - name: Verify proof evidence and application identity
        shell: bash
        run: |
          set -euo pipefail
          node scripts/faz3/verify-p1-native-proof-manifest.mjs \
            --manifest=delivery/CZA_Faz3_Delivery_Manifest_v4.json \
            --evidence="$RUNNER_TEMP/b1-native-provider-proof"
      - name: Reject replay and create single-use claim
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLAIM_NAME: ${{ steps.manifest.outputs.claim_name }}
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${CLAIM_NAME}&per_page=100" \
            > "$RUNNER_TEMP/b1-consumption-claims.json"
          node scripts/faz3/verify-p1-native-proof-manifest.mjs \
            --manifest=delivery/CZA_Faz3_Delivery_Manifest_v4.json \
            --replay-metadata="$RUNNER_TEMP/b1-consumption-claims.json" \
            --write-claim="$RUNNER_TEMP/b1-consumption-claim.json" \
            --consumer-run-id="$GITHUB_RUN_ID" \
            --consumed-at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Persist single-use proof claim before provisioning
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.manifest.outputs.claim_name }}
          path: ${{ runner.temp }}/b1-consumption-claim.json
          if-no-files-found: error
          retention-days: 30

  provision-neon-staging-project:
    needs: native-provider-proof-gate
    if: inputs.authorize_p1 == true && needs.native-provider-proof-gate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: CZA-STAGING-SECURITY
    permissions:
      contents: read
      actions: write
      id-token: write
    steps:
      - name: Checkout immutable Neon-only execution layer
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: fcf41e909dfa66f6dd70cf9c947dc708142ab442
          persist-credentials: false
      - name: Verify immutable runtime foundation
        shell: bash
        run: |
          set -euo pipefail
          echo 'b67b5d9897f98b334ed94110e81f53569395bde43ba4201b82e7e3ceeb209ad4  scripts/faz3/recovery-wal.mjs' | sha256sum --check --strict
          echo '59d123d21b9fde6caa1bccff001596890ae65ff71314e95d13d154d535a71df4  scripts/faz3/p1-neon-mutation-wrapper.mjs' | sha256sum --check --strict
          echo '2d7626f4f25b796378d921c721eedaab43bcb0a2fba5fc0d5edab28f128ee2b8  scripts/faz3/verify-p1-neon-static.mjs' | sha256sum --check --strict
      - name: Verify Neon-only static resource graph
        shell: bash
        run: |
          set -euo pipefail
          node scripts/faz3/verify-p1-neon-static.mjs
      - name: Create recovery identity before mutation
        id: recovery
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(node scripts/faz3/recovery-wal.mjs new-run-id /dev/null)"
          journal="recovery/${run_id}-neon-project.jsonl"
          node scripts/faz3/recovery-wal.mjs init "$journal" --run-id="$run_id" --resource=neon-staging-project
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "journal=$journal" >> "$GITHUB_OUTPUT"
      - name: Persist PREPARED WAL externally
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: faz3-p1-neon-wal-prepared-${{ steps.recovery.outputs.run_id }}
          path: ${{ steps.recovery.outputs.journal }}
          if-no-files-found: error
          retention-days: 30
      - name: Re-read externally durable PREPARED WAL
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: faz3-p1-neon-wal-prepared-${{ steps.recovery.outputs.run_id }}
          path: recovery/durable
      - name: Mark WAL durable after external PREPARED receipt
        shell: bash
        run: |
          set -euo pipefail
          durable="recovery/durable/$(basename '${{ steps.recovery.outputs.journal }}')"
          node scripts/faz3/recovery-wal.mjs receipt "$durable" --out=recovery/prepared.receipt
          node scripts/faz3/recovery-wal.mjs advance '${{ steps.recovery.outputs.journal }}' --state=WAL_DURABLE --receipt=recovery/prepared.receipt
      - name: Persist WAL_DURABLE externally before credential exchange
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: faz3-p1-neon-wal-durable-${{ steps.recovery.outputs.run_id }}
          path: ${{ steps.recovery.outputs.journal }}
          if-no-files-found: error
          retention-days: 30
      - name: Exchange exact-claim OIDC token for opaque broker lease
        shell: bash
        env:
          AUDIENCE: urn:cza:staging:credential-broker:v1
          BROKER_URL: ${{ vars.CZA_STAGING_CREDENTIAL_BROKER_URL }}
          P0C_SHA: ${{ inputs.p0c_attestation_sha256 }}
        run: |
          set -euo pipefail
          test -n "$BROKER_URL"
          [[ "$P0C_SHA" =~ ^[0-9a-f]{64}$ ]]
          token="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" | node -pe 'JSON.parse(require("fs").readFileSync(0)).value')"
          request="$(WAL_RUN_ID='${{ steps.recovery.outputs.run_id }}' node -e 'process.stdout.write(JSON.stringify({policy:"CZA-P1-NEON-RUNTIME-TRUST-V1",scopes:["staging:neon:create","staging:neon:inspect","staging:neon:delete"],ttlSeconds:900,p0cAttestationSha256:process.env.P0C_SHA,walRunId:process.env.WAL_RUN_ID}))')"
          broker="${BROKER_URL%/}"
          response="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            -H "Authorization: Bearer ${token}" -H 'content-type: application/json' \
            --data "$request" "${broker}/v1/exchange")"
          umask 077
          printf '%s' "$response" > recovery/neon-opaque-lease.json
          node -e '
            const fs = require("fs");
            const response = JSON.parse(fs.readFileSync("recovery/neon-opaque-lease.json"));
            const keys = ["expiresAt","leaseId","leaseToken","scopes","targetEnvironment"];
            if (!response || Object.keys(response).sort().join(",") !== keys.sort().join(",") || typeof response.leaseToken !== "string") throw new Error("BROKER_RESPONSE_INVALID");
            process.stdout.write(`::add-mask::${response.leaseToken}\n`);
          '
      - name: Mark REQUESTED immediately before broker mutation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/faz3/recovery-wal.mjs advance '${{ steps.recovery.outputs.journal }}' --state=REQUESTED
      - name: Persist REQUESTED WAL externally
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: faz3-p1-neon-wal-requested-${{ steps.recovery.outputs.run_id }}
          path: ${{ steps.recovery.outputs.journal }}
          if-no-files-found: error
          retention-days: 30
      - name: Create only the isolated Neon staging project through broker
        shell: bash
        env:
          AUDIENCE: urn:cza:staging:credential-broker:v1
          BROKER_URL: ${{ vars.CZA_STAGING_CREDENTIAL_BROKER_URL }}
        run: |
          set -euo pipefail
          token="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" | node -pe 'JSON.parse(require("fs").readFileSync(0)).value')"
          lease_id="$(node -pe 'JSON.parse(require("fs").readFileSync("recovery/neon-opaque-lease.json")).leaseId')"
          lease_token="$(node -pe 'JSON.parse(require("fs").readFileSync("recovery/neon-opaque-lease.json")).leaseToken')"
          request="$(LEASE_ID="$lease_id" node -e 'process.stdout.write(JSON.stringify({leaseId:process.env.LEASE_ID}))')"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            -H "Authorization: Bearer ${token}" \
            -H "x-cza-lease-token: ${lease_token}" \
            -H 'content-type: application/json' \
            --data "$request" "${BROKER_URL%/}/v1/neon/projects" > recovery/neon-staging-contract.json
          node scripts/faz3/p1-neon-mutation-wrapper.mjs \
            --journal='${{ steps.recovery.outputs.journal }}' \
            --lease-file=recovery/neon-opaque-lease.json \
            --contract-file=recovery/neon-staging-contract.json
          project_id="$(node -pe 'JSON.parse(require("fs").readFileSync("recovery/neon-staging-contract.json")).projectId')"
          node scripts/faz3/recovery-wal.mjs advance '${{ steps.recovery.outputs.journal }}' --state=OBSERVED --resource-id="$project_id"
          node scripts/faz3/recovery-wal.mjs advance '${{ steps.recovery.outputs.journal }}' --state=RECONCILED --resource-id="$project_id"
      - name: Persist final WAL and Neon staging contract
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: faz3-p1-neon-result-${{ steps.recovery.outputs.run_id }}
          path: |
            recovery/*-neon-project.jsonl
            recovery/neon-staging-contract.json
          if-no-files-found: error
          retention-days: 30
      - name: Revoke run-bound broker lease and remove opaque capability
        if: always()
        shell: bash
        env:
          AUDIENCE: urn:cza:staging:credential-broker:v1
          BROKER_URL: ${{ vars.CZA_STAGING_CREDENTIAL_BROKER_URL }}
        run: |
          set -euo pipefail
          trap 'rm -f recovery/neon-opaque-lease.json recovery/prepared.receipt' EXIT
          if [[ ! -f recovery/neon-opaque-lease.json ]]; then exit 0; fi
          test -n "$BROKER_URL"
          token="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" | node -pe 'JSON.parse(require("fs").readFileSync(0)).value')"
          lease_id="$(node -pe 'JSON.parse(require("fs").readFileSync("recovery/neon-opaque-lease.json")).leaseId')"
          lease_token="$(node -pe 'JSON.parse(require("fs").readFileSync("recovery/neon-opaque-lease.json")).leaseToken')"
          request="$(LEASE_ID="$lease_id" node -e 'process.stdout.write(JSON.stringify({leaseId:process.env.LEASE_ID}))')"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            -H "Authorization: Bearer ${token}" -H "x-cza-lease-token: ${lease_token}" -H 'content-type: application/json' \
            --data "$request" "${BROKER_URL%/}/v1/revoke" > /dev/null
