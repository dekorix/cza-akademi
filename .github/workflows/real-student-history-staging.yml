name: CZA Real Student History Staging Readback

on:
  push:
    branches:
      - feature/real-student-history-v1
    paths:
      - 'app/api/student-history/route.ts'
      - 'app/api/educator-report/route.ts'
      - 'app/studio/page.tsx'
      - 'lib/core-records.ts'
      - 'scripts/qa/real-student-history-staging.mjs'
      - '.github/workflows/real-student-history-staging.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/api/student-history/route.ts'
      - 'app/api/educator-report/route.ts'
      - 'app/studio/page.tsx'
      - 'lib/core-records.ts'
      - 'scripts/qa/real-student-history-staging.mjs'
      - '.github/workflows/real-student-history-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-history-readback:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: cza-history-readback-1b08e7db
    timeout-minutes: 10
    environment: CZA-STAGING-SECURITY
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: false

      - name: Ensure dependencies
        shell: cmd
        run: if exist node_modules\@neondatabase\serverless\package.json (echo Dependencies already present) else npm.cmd install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Canonical history write, dual readback and transactional cleanup
        env:
          CZA_STAGING_DATABASE_URL: ${{ secrets.CZA_STAGING_DATABASE_URL }}
        shell: cmd
        run: node scripts/qa/real-student-history-staging.mjs
