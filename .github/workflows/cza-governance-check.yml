name: CZA Governance Contract

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
    branches:
      - main
      - docs/cza-control-tower-20261008

permissions:
  contents: read

jobs:
  governance-contract:
    name: Scope and evidence PR gate (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source safely
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Configure Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - name: Verify governance validator and examples
        run: node --test tests/cza-governance-contract.test.mjs
      - name: Verify canonical source inventory and prevent accidental removal
        run: |
          node --test tests/cza-handoff-inventory-guard.test.mjs tests/cza-module-manifest.test.mjs tests/cza-ecosystem-marketing-boundary.test.mjs
          node scripts/qa/cza-handoff-inventory-guard.mjs
      - name: Check pull request documentation and unresolved publish effect
        env:
          CZA_PR_BODY: ${{ github.event.pull_request.body }}
          CZA_PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
        run: node scripts/qa/cza-governance-contract.mjs
