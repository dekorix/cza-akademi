name: V02 Candidate Student Link
on:
  pull_request:
    paths:
      - 'app/api/assessment-student-link/**'
      - 'lib/assessment-student-link.ts'
      - 'db/migrations/20261011_v02*'
      - 'tests/v02-*.test.mjs'
      - 'scripts/qa/cza-v02-native-postgres.mjs'
      - '.github/workflows/cza-v02-link.yml'
permissions:
  contents: read
jobs:
  no-secrets-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: cza_t5_synthetic
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/v02-*.test.mjs tests/t5-pre-enroll-resume.test.mjs tests/t5-pre-enroll-resume-client.test.mjs
      - run: node --test tests/canonical-learning-persistence.test.mjs tests/canonical-security-hardening.test.mjs tests/canonical-postgres-behavior.test.mjs tests/security-ci-hardening.test.mjs tests/cza-v01-pr-secrets-isolation.test.mjs
      - run: npx tsc --noEmit
      - run: node scripts/qa/cza-v02-native-postgres.mjs
        env:
          CZA_V02_NATIVE_DATABASE_URL: postgresql://postgres:synthetic-local-only@127.0.0.1:5432/cza_t5_synthetic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v02-native-postgres-proof
          path: docs/evidence/v02/native-postgres-concurrency.json
